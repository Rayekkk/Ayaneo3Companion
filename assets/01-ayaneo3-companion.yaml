# SPDX-License-Identifier: BSD-3-Clause
version: 1
kind: CompositeDevice
name: AYANEO 3 Companion
single_source: false
matches:
  - dmi_data:
      product_name: AYANEO 3
      sys_vendor: AYANEO
source_devices:
  - group: gamepad
    evdev:
      name: Microsoft X-Box 360 pad
      phys_path: usb-0000:c4:00.3-2/input0
      handler: event*
  - group: gamepad
    evdev:
      name: AYANEO COMPOSITE DEVICE
      phys_path: usb-0000:c4:00.3-1/input1
      handler: event*
    events:
      exclude: ["*"]
      include:
        - Keyboard:KeyL
        - Keyboard:KeyR
        - Keyboard:KeyF21
        - Keyboard:KeyF22
        - Keyboard:KeyF23
        - Keyboard:KeyF24
        - Keyboard:KeyLeftMeta
        - Keyboard:KeyD
        - Keyboard:KeyVolumeDown
        - Keyboard:KeyVolumeUp
  - group: gamepad
    evdev:
      name: AT Translated Set 2 keyboard
      phys_path: isa0060/serio0/input0
      handler: event*
    events:
      exclude: ["*"]
      include:
        - Keyboard:KeyF21
        - Keyboard:KeyF22
        - Keyboard:KeyF23
        - Keyboard:KeyF24
        - Keyboard:KeyVolumeDown
        - Keyboard:KeyVolumeUp
  - group: imu
    iio:
      name: bmi323-imu
options:
  auto_manage: true
target_devices:
  - xbox-elite
  - mouse
  - keyboard
capability_map_id: ayaneo3-companion
