# Ayaneo3Companion's own checks next to the shared checks.yml: a new release must stay installable by what users
# already run - the in-plugin updaters of 1.1.0 to 1.3.0 (they check the ZIP themselves) and the offline
# bootstrap.sh. Same header rules as checks.yml: pinned actions, read-only token, no credentials kept.
name: Older versions

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  legacy:
    name: Accepted by older updaters
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0  # the release tags whose updaters are checked
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          package-manager-cache: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Check the installer script's syntax
        run: bash -n bootstrap.sh
      - name: Build the package
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build
          npm run package
      - name: The updaters of 1.1.0 to 1.3.0 accept it
        run: python scripts/check-legacy-updaters.py artifacts/Ayaneo3Companion-*.zip
